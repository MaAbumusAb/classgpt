version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: classgpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: classgpt
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: classgpt-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: classgpt-backend
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/classgpt?schema=public
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      USE_OPENAI: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cd /app/apps/backend && npx prisma migrate deploy && node dist/main.js"

  worker:
    build:
      context: .
      dockerfile: workers/queue/Dockerfile
    container_name: classgpt-worker
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_OPENAI: 'false'
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
